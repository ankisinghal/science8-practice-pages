gen gas"], "a": 3, "x": "The gas is colourless, odourless, and burns with a pop sound.", "t": "Ch8 Nature of Matter: Elements, Compounds, and Mixtures", "svg": "", "cap": ""}, {"id": "S8C08039", "q": "Iron sulfide reacting with dilute hydrochloric acid gives a gas with a smell like", "o": ["roses", "nothing; it is odourless", "rotten eggs (hydrogen sulfide)", "vinegar"], "a": 2, "x": "The products are iron chloride and hydrogen sulfide.", "t": "Ch8 Nature of Matter: Elements, Compounds, and Mixtures", "svg": "", "cap": ""}, {"id": "S8C08209", "q": "Matter is anything that", "o": ["gives out light and heat", "moves without any push", "can be seen with the naked eye", "has mass and takes up space"], "a": 3, "x": "Elements and compounds are its building blocks.", "t": "Ch8 Nature of Matter: Elements, Compounds, and Mixtures", "svg": "", "cap": ""}, {"id": "S8V10007m", "q": "A round security mirror bulges outward above the counter of a small jewellery shop, so the shopkeeper can watch the whole showroom while billing. Wherever a customer stands in the showroom, their image in that mirror is always", "o": ["upside down and larger than the customer", "upright (erect) and smaller than the customer", "upside down and smaller than the customer", "upright and larger than the customer"], "a": 1, "x": "A mirror that bulges outward is convex; it spreads the reflected light to take in a wide area, and every image it forms stays erect and diminished, whatever the object's distance.", "t": "Ch10 Light: Mirrors and Lenses", "svg": "", "cap": ""}, {"id": "S8V01010a", "q": "Meera wants to know if dough thickness changes puffing time. In one trial she changes both the thickness and the oil temperature, and the puri puffs faster. What can she conclude?", "o": ["Both changes together always help a puri puff", "Nothing for sure, because two things changed at once", "The hotter oil alone made the puri puff much faster", "The thicker dough alone made the puri puff much faster"], "a": 1, "x"

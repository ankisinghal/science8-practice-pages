 crossing of two warehouse aisles so workers can see trolleys coming from the other aisle. Wherever a trolley is along its aisle, its image in that mirror is always", "o": ["upside down and smaller than the trolley", "upright (erect) and larger than the trolley", "upside down and larger than the trolley", "upright (erect) and smaller than the trolley"], "a": 3, "x": "A convex mirror always forms an erect, diminished image wherever the object is, so one mirror above the aisle crossing can show a wide view of both aisles.", "t": "Ch10 Light: Mirrors and Lenses", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

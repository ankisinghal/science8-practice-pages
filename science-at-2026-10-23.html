<script>const D={"id": "sbb17f9b8dd", "date": "2026-10-23", "type": "C01", "level": 2, "qs": [{"id": "S8C01020", "q": "Which of these is a pure substance?", "o": ["An alloy", "A solution", "A mixture", "An element"], "a": 3, "x": "Pure substances are elements and compounds - the same kind of particles throughout. A mixture, a solution and an alloy contain different substances physically mixed together, not chemically joined the way the elements in a compound are.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01137", "q": "A garden's flowering plants need bees to make seeds, and the bees collect nectar from the flowers. What does this show?", "o": ["Living things depend on and respond to other living things", "Gardens grow best with no insects at all", "Plants can always make seeds without any help from animals", "Bees depend only on the weather, not on plants"], "a": 0, "x": "Living organisms depend on and respond to other organisms around them - like plants and bees helping each other - forming the ecosystems that support life.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01119", "q": "Scientists can measure that something invisible holds galaxies together, but they do not yet know what it is made of. What does this tell us about science?", "o": ["Unanswered questions are not real science", "Some questions are still open for science", "Anything unexplained must be a wrong answer", "Science has answered everything already"], "a": 1, "x": "Science has not answered everything. Even very big questions - like what holds galaxies together - are still open, and exploring such questions is how science moves forward.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01120", "q": "A student says she cannot do science because her school has no laboratory. What is the best reply?", "o": ["She should wait until she reaches college", "She is right, real science always needs a laboratory", "She must first buy expensive equipment", "Simple experiments work anywhere, even in a kitchen"], "a": 3, "x": "Science is everywhere. You do not need a fancy laboratory - with curiosity, careful observation and asking what happens if, even your own kitchen is a place to do science.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01134", "q": "The Moon does not make any light of its own, yet it glows brightly in the night sky. Why?", "o": ["It makes fresh light of its own every night", "It borrows light from the stars", "It reflects the Sun's light falling on it", "It burns slowly like a small sun"], "a": 2, "x": "The Moon has no light of its own. Like any rough surface, it reflects the Sun's light, and that reflected light is what reaches our eyes.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01140", "q": "Human activities are warming the planet. What does that mean for fixing the climate problem?", "o": ["Nothing can slow it down any more", "People caused it, so people's choices can slow it", "Only natural events can ever slow it, never people", "It will fix itself if people just wait"], "a": 1, "x": "We are the ones influencing Earth's climate. That puts us at the heart of both the problem and the solution: human choices can also slow the warming.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8V03006g", "q": "A patient tells the doctor he has stomach pain, and the nurse measures high blood pressure. Which is correct?", "o": ["Both are signs, because the doctor measured them", "Both are symptoms, because the patient is unwell", "The stomach pain is a symptom and the high blood pressure is a sign", "The stomach pain is a sign and the high blood pressure is a symptom"], "a": 2, "x": "A symptom is something the patient feels and describes, like pain. A sign is something that can be seen or measured, like high blood pressure.", "t": "Review: Ch3 Health: The Ultimate Treasure", "svg": "", "cap": ""}, {"id": "S8V06004b", "q": "Two bags weigh the same, but one has broad straps and the other narrow straps. Why does the narrow-strap bag hurt the shoulder more?", "o": ["The same weight on a smaller area means more pressure", "The narrow straps make the bag heavier", "Narrow straps spread the same force over a larger area", "Broad straps reduce the bag's own weight"], "a": 0, "x": "Pressure is force per unit area. Both bags pull down with the same weight, but narrow straps press that weight onto a smaller area of the shoulder, so the pressure - and the hurt - is greater.", "t": "Review: Ch6 Pressure, Winds, Storms, and Cyclones", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="S8|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};

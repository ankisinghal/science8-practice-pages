<script>const D={"id": "sc98f517492", "date": "2026-10-23", "type": "C01", "level": 2, "qs": [{"id": "S8C01101", "q": "In Grade 6 students learnt that science begins with", "o": ["wonder, with simple Why and How questions", "copying down results straight from books", "building working machines from kits", "memorising long lists of formulas by heart"], "a": 0, "x": "Science begins with wonder - simple 'Why?' and 'How?' questions about the world around us - and grows into investigation.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01008", "q": "A student tests whether more sunlight helps a plant grow taller. Which of these should she observe or measure?", "o": ["The size of the pot she chooses", "The amount of sunlight she gives it", "The type of soil she picks", "The height the plant reaches"], "a": 3, "x": "She changes the sunlight on purpose, so that is not what she observes. Pot size and soil are kept the same for every plant. What she actually measures is the result: how tall the plant grows.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01020", "q": "Which of these is a pure substance?", "o": ["An element", "An alloy", "A mixture", "A solution"], "a": 0, "x": "Pure substances are elements and compounds. A mixture, a solution and an alloy are physical combinations of different substances that can be separated.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01130", "q": "A small difference in air pressure can give a gentle breeze. A larger difference can lead to", "o": ["a flood from a rising river", "an earthquake near the coast", "strong winds and even cyclones", "a change in the length of the day"], "a": 2, "x": "The same force and pressure ideas decide how air moves. A small difference in pressure makes a gentle breeze; a stronger difference can lead to powerful weather events like storms and cyclones.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01137", "q": "Living organisms depend on and respond to air, water, sunlight and", "o": ["the buildings made by people", "the stones lying around them", "other organisms around them", "the vehicles on the road"], "a": 2, "x": "Living organisms depend on and respond to air, water, sunlight and other organisms around them, forming the ecosystems that support life on our planet.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01138", "q": "What makes Earth 'just right' for life?", "o": ["Its complete lack of any seasons", "Being the biggest planet in the whole solar system", "Its many moons and bright shining rings", "Its distance from the Sun, liquid water and air"], "a": 3, "x": "Earth lies at just the right distance from the Sun, where water stays liquid, and its atmosphere provides oxygen and shields us from harmful rays.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8V03006g", "q": "A patient tells the doctor he has stomach pain, and the nurse measures high blood pressure. Which is correct?", "o": ["The stomach pain is a sign and the high blood pressure is a symptom", "The stomach pain is a symptom and the high blood pressure is a sign", "Both are signs, because the doctor measured them", "Both are symptoms, because the patient is unwell"], "a": 1, "x": "A symptom is something the patient feels and describes, like pain. A sign is something that can be seen or measured, like high blood pressure.", "t": "Review: Ch3 Health: The Ultimate Treasure", "svg": "", "cap": ""}, {"id": "S8V06004a", "q": "A force of 900 N acts evenly on an area of 3 m\u00b2. What is the pressure?", "o": ["900 Pa", "300 Pa", "2700 Pa", "30 Pa"], "a": 1, "x": "Pressure is force per unit area: 900 N over 3 m\u00b2 is 300 N/m\u00b2, and N/m\u00b2 is called a pascal (Pa).", "t": "Review: Ch6 Pressure, Winds, Storms, and Cyclones", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});

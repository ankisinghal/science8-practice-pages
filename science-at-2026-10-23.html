<script>const D={"id": "sd81faa869b", "date": "2026-10-23", "type": "C01", "level": 2, "qs": [{"id": "S8C01101", "q": "Ravi notices that puddles dry up faster on windy days and wonders why. What has Ravi done that counts as the start of science?", "o": ["Asked a question out of curiosity about the world", "Finished a full experiment on drying puddles", "Read the answer in a science book", "Proved exactly why puddles dry up faster on windy days"], "a": 0, "x": "Science begins with wonder - simple Why and How questions about the world. Noticing something and asking why is the first step; proving something or finishing an experiment comes much later.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01008", "q": "A student tests whether more sunlight helps a plant grow taller. Which of these should she measure as the outcome?", "o": ["The amount of sunlight she gives it", "The type of soil she picks", "The size of the pot she chooses", "The height the plant reaches"], "a": 3, "x": "She changes the sunlight on purpose, so that is the thing she varies, not the outcome. Pot size and soil are kept the same for every plant. The outcome she measures is how tall the plant grows.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01020", "q": "Which of these is a pure substance?", "o": ["An alloy", "A solution", "An element", "A mixture"], "a": 2, "x": "Pure substances are elements and compounds - the same kind of particles throughout. A mixture, a solution and an alloy contain different substances physically mixed together, not chemically joined the way the elements in a compound are.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01130", "q": "Weather reports say the air pressure difference over the sea is growing quickly. What should people near the coast expect?", "o": ["Winds growing stronger, possibly a storm", "The wind dying down to a complete stop", "Cooler nights with no wind at all", "Several days of calm, still air along the coast"], "a": 0, "x": "Moving air is driven by pressure differences. A small difference gives a gentle breeze; a larger and growing difference can bring strong winds, storms or even cyclones.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01137", "q": "A garden's flowering plants need bees to make seeds, and the bees collect nectar from the flowers. What does this show?", "o": ["Plants can always make seeds without any help from animals", "Gardens grow best with no insects at all", "Bees depend only on the weather, not on plants", "Living things depend on and respond to other living things"], "a": 3, "x": "Living organisms depend on and respond to other organisms around them - like plants and bees helping each other - forming the ecosystems that support life.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01138", "q": "Why can liquid water exist on Earth but not on planets much closer to the Sun?", "o": ["Earth's air is made only of oxygen", "Earth is the largest planet in the whole solar system", "Earth's distance from the Sun keeps it just right for liquid water", "Earth has many more moons than any other planet in the solar system"], "a": 2, "x": "Earth lies at just the right distance from the Sun: close enough to stay warm, far enough that water does not all boil away, so water stays liquid and life is possible.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8V03006g", "q": "A patient tells the doctor he has stomach pain, and the nurse measures high blood pressure. Which is correct?", "o": ["Both are signs, because the doctor measured them", "The stomach pain is a symptom and the high blood pressure is a sign", "The stomach pain is a sign and the high blood pressure is a symptom", "Both are symptoms, because the patient is unwell"], "a": 1, "x": "A symptom is something the patient feels and describes, like pain. A sign is something that can be seen or measured, like high blood pressure.", "t": "Review: Ch3 Health: The Ultimate Treasure", "svg": "", "cap": ""}, {"id": "S8V06004a", "q": "A force of 900 N acts evenly on an area of 3 m\u00b2. What is the pressure?", "o": ["2700 Pa", "300 Pa", "900 Pa", "30 Pa"], "a": 1, "x": "Pressure is force per unit area: 900 N over 3 m\u00b2 is 300 N/m\u00b2, and N/m\u00b2 is called a pascal (Pa).", "t": "Review: Ch6 Pressure, Winds, Storms, and Cyclones", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});

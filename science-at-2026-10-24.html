<script>const D={"id": "s98b549358d", "date": "2026-10-24", "type": "MIX", "level": 2, "qs": [{"id": "S8V10007d", "q": "A mirror at a blind road corner shows a wide view of the road with small, upright images of vehicles. Which mirror is it?", "o": ["A convex mirror, as it always forms erect, diminished images", "A concave mirror, as it always forms erect, diminished images", "A plane mirror, as it always forms erect, diminished images", "A convex lens, as it always forms erect, diminished images"], "a": 0, "x": "A convex mirror always forms an erect image that is smaller than the object, so one mirror shows a wide view; this is why convex mirrors are used at corners and as side-view mirrors.", "t": "Review: Ch10 Light: Mirrors and Lenses", "svg": "", "cap": ""}, {"id": "S8V01019b", "q": "Water is formed when hydrogen and oxygen join together chemically. Which kind of substance is water?", "o": ["An element, because it contains only one kind of atom", "A solution, because one part dissolves in the other", "A mixture, because its parts can be separated physically", "A compound, because it has two elements chemically bonded"], "a": 3, "x": "A compound is a substance made of two or more elements bonded together. Water has hydrogen and oxygen bonded together, so it is a compound, not an element or a mixture.", "t": "Review: Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8V12006b", "q": "All the rose plants growing in one park together form a population. What do the populations of all the different living things in that park together form?", "o": ["A habitat", "A community", "An ecosystem", "A biosphere"], "a": 1, "x": "A population is a group of the same kind of organism in a place. Different populations living together in the same habitat form a community; the community together with non-living things like air, water and soil forms the ecosystem.", "t": "Review: Ch12 How Nature Works in Harmony", "svg": "", "cap": ""}, {"id": "S8V01115a", "q": "During an experiment, a student writes down everything she sees, smells and hears. What is the MAIN use of this habit?", "o": ["Writing notes can replace repeating the experiment later", "Notes make the experiment finish correctly every time", "Notes record what happened and can prompt new questions", "Notes prove that her first guess was correct"], "a": 2, "x": "Notes on what you see, smell or hear are a record of the experiment, and looking back at them helps you think of new questions to test.", "t": "Review: Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8V02175a", "q": "Under a microscope, a bacterium looks long and capsule-like. This shape is called", "o": ["Rod-shaped", "Comma-shaped", "Spiral", "Spherical"], "a": 0, "x": "Bacteria come in several shapes: spherical, comma, spiral and rod-shaped. A long, capsule-like bacterium is rod-shaped.", "t": "Review: Ch2 The Invisible Living World: Beyond Our Naked Eye", "svg": "", "cap": ""}, {"id": "S8V01116a", "q": "After finishing one round of experiments, which of these is a good NEW question to ask next?", "o": ["One that cannot be checked by any test", "One that can be tested with another experiment", "One whose answer is already known for sure", "One about who should get the credit for the work"], "a": 1, "x": "A round of experiments usually leads to new questions. A good new question can be tested with further experiments, which keeps the investigation going.", "t": "Review: Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8V02214b", "q": "Microalgae in the ocean are important for life on Earth mainly because they", "o": ["breathe in oxygen like land animals", "feed directly on land plants", "release oxygen as they make their own food", "produce food only when it is dark"], "a": 2, "x": "Microalgae make their own food using sunlight and release oxygen in the process. Tiny plankton such as microalgae together produce a very large share of the oxygen made on Earth.", "t": "Review: Ch2 The Invisible Living World: Beyond Our Naked Eye", "svg": "", "cap": ""}, {"id": "S8V01010c", "q": "Ravi wants to test whether adding salt makes water boil faster. In one trial he adds salt AND turns the flame up higher, and the water boils sooner. What can he conclude?", "o": ["The salt alone made the water boil sooner", "Both changes together always make water boil faster", "The higher flame alone made the water boil sooner", "Nothing for sure, because two things changed at once"], "a": 3, "x": "When two things change together, we cannot tell which one caused the effect. A fair test changes only one thing at a time while keeping the other conditions the same.", "t": "Review: Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="S8|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};

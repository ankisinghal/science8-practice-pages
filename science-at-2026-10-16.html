<script>const D={"id": "sf7f2d5d63c", "date": "2026-10-16", "type": "C01", "level": 2, "qs": [{"id": "S8C01018", "q": "What can the particles in a solid do?", "o": ["They do not move in any way at all", "They move freely past one another like in a liquid", "They escape from the solid into the air", "They stay in fixed positions and only vibrate"], "a": 3, "x": "In a solid, particles are held close by strong forces of attraction. They vibrate about their fixed positions but cannot move past each other.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01128", "q": "A ball thrown up falls back down. Understanding why this happens needs the idea of", "o": ["calendars", "forces", "pure substances", "microbes"], "a": 1, "x": "Understanding forces helps explain why a ball thrown up in the air falls back to the ground, or why a car stops when the brakes are applied.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01116", "q": "After one round of puri experiments, which is a good NEW question?", "o": ["Should we stop experimenting after one round of tests?", "Which plate should we serve the puris on?", "Do puris puff better from fresh dough?", "Who first thought of frying dough in oil?"], "a": 2, "x": "New questions after a round of experiments are the next step of systematic investigation; a good new question can be tested.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01118", "q": "The process of asking, testing, noting and asking again is called", "o": ["casual browsing online", "systematic investigation", "copying answers from a book", "random guessing from memory"], "a": 1, "x": "Asking a question, testing it, noting what happens and asking new questions again is called systematic investigation.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01125", "q": "Investigation works best when we balance", "o": ["speed of working with silence in class", "memory of facts with copying from others", "careful observation with creative thinking", "reading from books with guessing the answers"], "a": 2, "x": "Investigation works best when we balance the solid ground of careful observation with the freedom of creative thinking.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01027", "q": "Human activities can disturb climate patterns by causing", "o": ["small changes in the temperature of the Earth", "steady cooling of the Earth to a much lower temperature", "a large increase in the ozone layer", "no change in the temperature of the Earth"], "a": 0, "x": "Human activities such as burning fuels can slowly shift the Earth's temperature and climate patterns.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8V12006a", "q": "Which statement about an ecosystem is CORRECT?", "o": ["A community is a part of an ecosystem", "An ecosystem is smaller than a population", "An ecosystem is a part of a community", "A population is larger than a community"], "a": 0, "x": "A population is part of a community, and a community is part of an ecosystem.", "t": "Ch12 How Nature Works in Harmony", "svg": "", "cap": ""}, {"id": "S8V01019a", "q": "Which statement correctly tells a compound apart from a mixture?", "o": ["A compound has only one kind of atom, but a mixture has two or more kinds", "A compound can be separated physically, but a mixture has elements bonded together", "A compound and a mixture can both be separated only by bonding elements again", "A compound has elements bonded together, but a mixture can be separated physically"], "a": 3, "x": "Materials are classified as elements (pure substances), compounds (two or more elements bonded together) and mixtures (combinations that can be separated physically).", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}]};const rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});

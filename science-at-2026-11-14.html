<script>const D={"id": "sb979ccf45c", "date": "2026-11-14", "type": "C10", "level": 2, "qs": [{"id": "S8C08108", "q": "Which set of elements can be components of stainless steel?", "o": ["Iron, tin, zinc and oxygen", "Iron, nickel, chromium and carbon", "Iron, copper, tin and sulfur", "Iron, zinc, copper and hydrogen"], "a": 1, "x": "Stainless steel can contain iron, nickel, chromium and a small amount of carbon. Carbon is a non-metal. An alloy can contain a non-metal as well as metals.", "t": "Ch8 Nature of Matter: Elements, Compounds, and Mixtures", "svg": "", "cap": ""}, {"id": "S8C08174", "q": "A salt solution contains only common salt dissolved in water. Which method can recover the solid salt?", "o": ["Using a bar magnet", "Filtering through paper", "Evaporating the water", "Allowing it to settle"], "a": 2, "x": "Dissolved salt passes through filter paper and does not settle out. Evaporating the water leaves the salt behind without breaking the salt into its elements.", "t": "Ch8 Nature of Matter: Elements, Compounds, and Mixtures", "svg": "", "cap": ""}, {"id": "S8C08187", "q": "Iron filings and sulfur powder are gently mixed without heating or reacting. How can the iron be removed from this mixture?", "o": ["Attract it with a magnet", "Pass it through filter paper", "Dissolve it in plain water", "Leave it to evaporate"], "a": 0, "x": "In the unreacted mixture, iron retains its magnetic property and can be attracted by a magnet. Sulfur is left behind. This uses a difference in the components' physical properties.", "t": "Ch8 Nature of Matter: Elements, Compounds, and Mixtures", "svg": "", "cap": ""}, {"id": "S8C08195", "q": "A teacher has checked that a particular laboratory sample may be smelled safely and is supervising. Which action follows the correct smelling precaution?", "o": ["Take a deep breath from inside the container", "Put the nose directly over the container", "Heat the sample first to make more vapour", "Gently fan a little vapour towards the nose"], "a": 3, "x": "Only smell a laboratory sample when the teacher has checked it and instructs you to do so. Use gentle wafting, never direct sniffing. Do not smell an unknown chemical or gas on your own.", "t": "Ch8 Nature of Matter: Elements, Compounds, and Mixtures", "svg": "", "cap": ""}, {"id": "S8C08201", "q": "A naturally occurring solid mineral sample consists of elemental copper, rather than copper chemically combined with another element. Which mineral category fits it?", "o": ["A mineral mixture", "A native mineral", "A compound mineral", "A metal alloy"], "a": 1, "x": "Native minerals occur as elements rather than compounds. Copper can occur in this form. The word native describes its elemental form, not where the sample was found.", "t": "Ch8 Nature of Matter: Elements, Compounds, and Mixtures", "svg": "", "cap": ""}, {"id": "S8C08206", "q": "An artisan covers a wax model with clay, lets the clay harden, then melts the wax out. Why must the wax be removed before molten metal is poured in?", "o": ["To turn the clay coating into a metal", "To make the wax dissolve in the metal", "To leave the original wax inside the figure", "To leave a space matching the model's shape"], "a": 3, "x": "Removing the wax leaves a hollow space inside the clay mould. Molten brass or bronze fills that space and takes the model's shape when it solidifies. This is the lost-wax process used in Dhokra art.", "t": "Ch8 Nature of Matter: Elements, Compounds, and Mixtures", "svg": "", "cap": ""}, {"id": "S8C02008", "q": "A cell takes in materials needed for life and releases waste. Which boundary allows these materials to enter and leave the cell?", "o": ["Cell membrane", "Chloroplast", "Nucleus", "Cytoplasm"], "a": 0, "x": "The cell membrane encloses the cell and controls the entry and exit of materials. The nucleus regulates cell activities; the cytoplasm is the material within the membrane.", "t": "Ch2 The Invisible Living World: Beyond Our Naked Eye", "svg": "", "cap": ""}, {"id": "S8C02028", "q": "A virus has access to nutrients but is outside all living cells. Which condition is still needed for it to multiply?", "o": ["Contact with any wet non-living surface", "Exposure to a source of bright light", "Entry into a living host cell", "Placement in a warm container of sugar"], "a": 2, "x": "Viruses are acellular and multiply only inside living host cells. Nutrients or warmth outside a living cell do not by themselves allow a virus to reproduce.", "t": "Ch2 The Invisible Living World: Beyond Our Naked Eye", "svg": "", "cap": ""}, {"id": "S8V12006d", "q": "Three survey records describe a pond: P lists all the frogs of one species; Q lists all the living populations; R includes Q together with water, light and their interactions. Which order runs from population to community to ecosystem?", "o": ["P, then Q, then R", "P, then R, then Q", "Q, then P, then R", "R, then Q, then P"], "a": 0, "x": "P is a population of one species. Q is the community of different living populations. R is the ecosystem, which includes the community, non-living components and their interactions. A community is part of an ecosystem.", "t": "Ch12 How Nature Works in Harmony", "svg": "", "cap": ""}, {"id": "S8V01026a", "q": "A planet is so close to its star that surface water cannot remain liquid. Which change would most directly address this obstacle to life as we know it?", "o": ["A surface with a greater number of craters", "An orbital distance allowing liquid water", "An orbit with fewer other planets nearby", "A year divided into a larger number of days"], "a": 1, "x": "A suitable distance from a star can allow temperatures at which water remains liquid. Earth's distance from the Sun helps provide this condition. Distance alone does not guarantee habitability; other conditions, including the atmosphere, also matter.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});

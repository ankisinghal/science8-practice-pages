<script>const D={"id": "s15e1d1df64", "date": "2026-10-22", "type": "C01", "level": 2, "qs": [{"id": "S8C01002", "q": "In science, the main aim is to learn how to", "o": ["read about scientists' lives", "use laboratory equipment correctly", "memorise facts that others have found", "find new facts by investigating"], "a": 3, "x": "Science is about learning how to find new facts: ask focused questions, try simple experiments and use observations to improve understanding.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01007", "q": "A student tests whether water temperature changes how fast sugar dissolves. She uses the same amount of sugar and stirs every cup in the same way, but uses cold, warm and hot water. What is she deliberately changing?", "o": ["The amount of sugar in each cup", "The temperature of the water", "The way she stirs each cup", "The time the sugar takes to dissolve"], "a": 1, "x": "She changes only the water temperature and keeps everything else the same. What we deliberately change or control is separate from what we observe or measure, like the dissolving time.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01011", "q": "Why is it a good idea to keep notes of everything you see and sense during an experiment?", "o": ["They tell us which observations to ignore", "They help us think of new questions to ask next", "They let us skip measuring in the next experiment", "They show that our first idea was correct"], "a": 1, "x": "Keeping notes of what we see and sense helps us think of more questions after a round of experiments.", "t": "Ch1 Exploring the Investigative World of Science", "svg": "", "cap": ""}, {"id": "S8C01015", "q": "The heating effect of electric current is used to", "o": ["keep us warm", "run motors", "split water", "make magnets"], "a": 0, "x": "Electric current heats a wire, as in a heater or geyser. This is the heating effect, used to keep us  Ch4 Electricity: Magnetic and Heating Effects", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

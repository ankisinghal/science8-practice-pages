nd like a ball", "Spherical: twisted like a corkscrew", "Rod-shaped: long and narrow, like a stick", "Comma-shaped: perfectly straight like a pencil"], "a": 2, "x": "Bacteria can be spherical (round), rod-shaped (long and narrow), spiral (twisted) or comma-shaped (curved).", "t": "Ch2 The Invisible Living World", "svg": "", "cap": ""}, {"id": "S8V02147a", "q": "The heart has muscle tissue, nerve tissue and other tissues organised together to pump blood. The heart is therefore an example of", "o": ["a single cell", "an organ", "a whole organism", "an organ system"], "a": 1, "x": "Different tissues organised together to do one job form an organ. The heart is an organ; several organs working together form an organ system.", "t": "Ch2 The Invisible Living World", "svg": "", "cap": ""}, {"id": "S8V07027c", "q": "The solid, liquid and gas forms of one substance differ in the thermal energy of their particles. Which order goes from the LOWEST to the HIGHEST thermal energy?", "o": ["Solid, liquid, gas", "Solid, gas, liquid", "Gas, liquid, solid", "Liquid, solid, gas"], "a": 0, "x": "In a solid the particles have low thermal energy and only vibrate. In a liquid they have more, and in a gas they have enough to move freely in all directions.", "t": "Ch7 Particulate Nature of Matter", "svg": "", "cap": ""}, {"id": "S8V07022b", "q": "When 50 mL of water is mixed with 50 mL of alcohol, the mixture measures a little less than 100 mL. The best explanation is that", "o": ["some of the liquid is destroyed as they mix", "the particles of one liquid fit into the gaps between the particles of the other", "the water particles turn into alcohol particles", "the particles of both liquids become smaller"], "a": 1, "x": "Matter is made of particles with spaces between them. Particles of one liquid fill gaps between the particles of the other, so the total volume is a little less.", "t": "Ch7 Particulate Nature of Matter", "svg": "", "cap": ""}, {"id": "S8V08012d", "q": "A sack of dry quick lime stored in a shed is soaked by rain and becomes hot. Which statement explains this?", "o": ["The quick lime melts, so it takes in heat from the surroundings", "The water splits into hydrogen and oxygen gas, which takes in heat", "The quick lime only dissolves in the water, so nothing new forms and the heat comes from the sack", "The quick lime reacts with water to form calcium hydroxide, and the reaction gives out heat"], "a": 3, "x": "Calcium oxide (quick lime) reacts vigorously with water to form calcium hydroxide and releases heat.", "t": "Ch8 Nature of Matter: Elements, Compounds, and Mixtures", "svg": "", "cap": ""}, {"id": "S8V08129c", "q": "Which pair of gases are both counted among the major air pollutants?", "o": ["Argon and water vapour", "Ozone and nitrogen dioxide", "Nitrogen and argon", "Oxygen and nitrogen"], "a": 1, "x": "The major gaseous air pollutants include carbon monoxide, ozone, nitrogen dioxide and sulfur dioxide. Oxygen, nitrogen and argon are normal gases of clean air.", "t": "Ch8 Nature of Matter: Elements, Compounds, and Mixtures", "svg": "", "cap": ""}, {"id": "S8V04109a", "q": "A compass needle kept close to a wire carrying a current swings away from its usual direction. This shows that the space around the wire", "o": ["has become electrically charged for ever", "has turned into a steel magnet", "stores heat that the needle absorbs", "is a region with a magnetic field"], "a": 3, "x": "A magnetic field is the region where a magnetic effect can be felt. The needle's deflection shows the effect of the field around the wire.", "t": "Ch4 Electricity: Magnetic and Heating Effects", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

<script>const D={"id": "s0415201cd0", "date": "2026-10-26", "type": "C07", "level": 2, "qs": [{"id": "S8C07007", "q": "In solids, the particles", "o": ["move freely in all directions through the solid", "are very far apart from one another in the solid", "vibrate about fixed positions and cannot slip past", "move past each other easily in the solid"], "a": 2, "x": "Interparticle attractions are strongest in solids.", "t": "Ch7 Particulate Nature of Matter", "svg": "", "cap": ""}, {"id": "S8C07011", "q": "Which has the highest melting point among ice (0 \u00b0C), urea (133 \u00b0C) and iron (1538 \u00b0C)?", "o": ["Ice", "Iron", "Urea", "All are equal"], "a": 1, "x": "A higher melting point means stronger interparticle attractions. Iron's 1538 degrees C is far above ice and urea.", "t": "Ch7 Particulate Nature of Matter", "svg": "", "cap": ""}, {"id": "S8C07014", "q": "Why can you move your finger through water but not through a solid?", "o": ["Water particles do not move at all", "Liquid particles are far apart just like in a gas", "Water has no particles to push against", "In liquids the attractions between particles are weaker"], "a": 3, "x": "Liquid particles are free to move within limited space.", "t": "Ch7 Particulate Nature of Matter", "svg": "", "cap": ""}, {"id": "S8C07019", "q": "The gas in a syringe can be compressed easily because", "o": ["gases have strong interparticle attractions", "gas particles are tightly packed", "gas has no mass", "gas particles have a lot of space between them"], "a": 3, "x": "Water, by contrast, is practically incompressible.", "t": "Ch7 Particulate Nature of Matter", "svg": "", "cap": ""}, {"id": "S8C07024", "q": "Potassium permanganate crystals dropped in water slowly colour the whole water because", "o": ["permanganate is a gas that mixes with the water", "water particles keep moving and spread the permanganate", "the crystal floats and spreads over the surface", "water is magnetic and attracts the permanganate"], "a": 1, "x": "Particles of matter are always moving.", "t": "Ch7 Particulate Nature of Matter", "svg": "", "cap": ""}, {"id": "S8C07027", "q": "Thermal energy of particles determines", "o": ["the physical state of matter", "the colour of matter", "the density of the atmosphere", "the number of particles only"], "a": 0, "x": "Low thermal energy means solid; high thermal energy means gas.", "t": "Ch7 Particulate Nature of Matter", "svg": "", "cap": ""}, {"id": "S8V10007f", "q": "An object is moved to different distances in front of a convex mirror. What happens to the image it forms each time?", "o": ["It stays erect and smaller (diminished) than the object at every distance", "It becomes larger than the object when the object comes very close", "It becomes inverted when the object is moved very far away", "It becomes the same size as the object when the object comes very close"], "a": 0, "x": "A convex mirror always forms an erect and diminished image, whatever the distance of the object from it.", "t": "Review: Ch10 Light: Mirrors and Lenses", "svg": "", "cap": ""}, {"id": "S8V08005a", "q": "Brass looks the same throughout, and the copper and zinc in it cannot be seen separately. What kind of mixture is brass?", "o": ["A non-uniform mixture", "A compound with a fixed ratio", "A uniform mixture", "A pure element"], "a": 2, "x": "Mixtures whose components are evenly distributed and cannot be distinguished are uniform mixtures. Alloys such as brass (copper and zinc) and bronze (copper and tin) are examples.", "t": "Review: Ch8 Nature of Matter: Elements, Compounds, and Mixtures", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
